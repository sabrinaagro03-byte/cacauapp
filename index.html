<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Controle de Qualidade do Cacau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>
  // Registra o service worker apenas quando o app estiver hospedado em http(s) —
  // isso é o que permite "Adicionar à tela inicial" funcionar como um app instalável.
  if ('serviceWorker' in navigator && (location.protocol==='http:' || location.protocol==='https:')) {
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{ /* sem sw.js hospedado junto, ignora */ });
    });
  }
</script>

<style>
  :root{
    --bark:#241610; --bark-2:#3a271c;
    --paper:#F6F0E4; --paper-2:#EDE3CE;
    --ink:#241610; --ink-soft:#5b4a3d;
    --rust:#BD5A21; --rust-dark:#9A4718;
    --pod-green:#4E6B45; --ferment:#8A5A2E; --dry:#C08A16; --classify:#3C5670;
    --line:#DCCEB0; --ok:#3E7A45; --danger:#A83B2C;
    --radius:10px; --shadow: 0 2px 10px rgba(36,22,16,0.10);
  }
  *{box-sizing:border-box;}
  #cacau-root{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);min-height:100%;width:100%;line-height:1.4;-webkit-font-smoothing:antialiased;}
  #cacau-root h1,#cacau-root h2,#cacau-root h3{font-family:'Fraunces',serif;font-weight:600;margin:0;color:var(--bark);}
  #cacau-root button, #cacau-root input, #cacau-root select, #cacau-root textarea{font-family:inherit;}

  .app-shell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:90px;}

  .topbar{background:var(--bark);color:var(--paper);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  .topbar .brand{display:flex;align-items:center;gap:10px;}
  .pod-mark{width:26px;height:26px;flex-shrink:0;}
  .topbar h1{color:var(--paper);font-size:19px;letter-spacing:0.2px;}
  .topbar .sub{font-size:11px;color:#c8b79f;margin-top:1px;font-family:'Inter',sans-serif;}
  .back-btn{background:none;border:none;color:var(--paper);font-size:15px;cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px 2px;font-weight:600;}
  .user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border-radius:99px;padding:5px 12px 5px 6px;cursor:pointer;border:none;color:var(--paper);}
  .avatar{width:24px;height:24px;border-radius:50%;background:var(--rust);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;}

  .screen{padding:20px 18px 8px;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 28px;background:radial-gradient(circle at 15% 8%, #3a2718 0%, var(--bark) 55%);}
  .login-wrap .pod-mark-big{width:56px;height:56px;margin-bottom:18px;}
  .login-wrap h1{color:var(--paper);font-size:30px;line-height:1.15;}
  .login-wrap .tag{color:#cbb79c;font-size:13px;margin-top:8px;margin-bottom:34px;letter-spacing:.3px;}
  .login-label{color:#cbb79c;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:600;}
  .colab-list{display:flex;flex-direction:column;gap:10px;}
  .colab-btn{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius);padding:13px 14px;color:var(--paper);font-size:15px;font-weight:600;cursor:pointer;text-align:left;transition:background .15s;}
  .colab-btn:hover{background:rgba(255,255,255,0.13);}
  .colab-btn .avatar{background:var(--rust);}
  .colab-btn small{display:block;color:#b8a68c;font-weight:400;font-size:11.5px;margin-top:1px;}

  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:700;margin:22px 0 10px;}
  .stat-row{display:flex;gap:10px;margin-bottom:6px;}
  .stat-card{flex:1;background:white;border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
  .stat-card .num{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--bark);}
  .stat-card .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .lote-card{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 13px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s;}
  .lote-card:active{transform:scale(0.985);}
  .lote-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .lote-id-seal{font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--bark);background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;display:inline-block;}
  .stage-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:4px 9px;border-radius:99px;color:white;white-space:nowrap;}
  .lote-meta{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--ink-soft);}
  .lote-meta b{color:var(--ink);font-weight:600;}
  .progress-track{height:5px;background:var(--paper-2);border-radius:99px;margin-top:11px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:99px;background:var(--rust);}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state svg{margin-bottom:14px;opacity:.55;}
  .empty-state p{font-size:13.5px;max-width:240px;margin:6px auto 0;}

  .fab{position:fixed;bottom:24px;right:20px;background:var(--rust);color:white;border:none;border-radius:99px;padding:14px 22px;font-weight:700;font-size:14.5px;box-shadow:0 6px 18px rgba(189,90,33,0.4);display:flex;align-items:center;gap:8px;cursor:pointer;z-index:30;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
  .field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;font-weight:400;text-transform:none;letter-spacing:0;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field input[type=datetime-local], .field select, .field textarea{
    width:100%;border:1.5px solid var(--line);border-radius:8px;padding:12px 13px;font-size:15px;background:white;color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--rust);}
  .field textarea{resize:vertical;min-height:64px;}
  .readonly-box{background:var(--paper-2);border:1.5px dashed var(--line);border-radius:8px;padding:11px 13px;font-size:14.5px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:8px;padding:13px 18px;font-weight:700;font-size:14.5px;cursor:pointer;width:100%;}
  .btn-primary{background:var(--rust);color:white;}
  .btn-primary:active{background:var(--rust-dark);}
  .btn-secondary{background:white;color:var(--bark);border:1.5px solid var(--line);}
  .btn-ghost{background:transparent;color:var(--rust);padding:9px 4px;width:auto;font-size:13.5px;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-sm{padding:9px 12px;font-size:13px;width:auto;}

  .photo-grid{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px;}
  .photo-thumb-wrap{position:relative;width:72px;height:72px;}
  .photo-thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;border:1.5px solid var(--line);display:block;}
  .photo-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--bark);color:white;border:none;font-size:12px;line-height:1;cursor:pointer;}
  .photo-add{width:72px;height:72px;border-radius:8px;border:1.5px dashed var(--ink-soft);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;background:none;font-size:22px;}

  .lote-header{background:var(--bark);color:var(--paper);padding:18px 18px 20px;position:sticky;top:53px;z-index:15;}
  .lote-header .id{font-family:'Fraunces',serif;font-size:22px;font-weight:700;}
  .lote-header .talhao{font-size:12.5px;color:#cbb79c;margin-top:2px;}
  .tabs{display:flex;gap:6px;margin-top:16px;overflow-x:auto;padding-bottom:2px;}
  .tab{flex:0 0 auto;padding:8px 13px;border-radius:99px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,0.08);color:#cbb79c;cursor:pointer;white-space:nowrap;border:1.5px solid transparent;}
  .tab.active{background:var(--paper);color:var(--bark);}
  .tab.done::after{content:" ✓";}

  .card{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card-title{font-size:14px;font-weight:700;color:var(--bark);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}

  .item-card{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
  .item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;cursor:pointer;}
  .item-head .tag-id{font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--bark);display:flex;align-items:center;gap:8px;}
  .item-head .chevron{color:var(--ink-soft);font-size:13px;transition:transform .15s;}
  .item-head.open .chevron{transform:rotate(180deg);}
  .item-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .item-body{margin-top:14px;display:none;}
  .item-body.open{display:block;}
  .icon-del{background:none;border:none;color:var(--danger);font-size:12px;font-weight:700;cursor:pointer;padding:4px 6px;}

  .add-row-btn{width:100%;border:1.5px dashed var(--rust);background:none;color:var(--rust);border-radius:var(--radius);padding:13px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:14px;}

  table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.data-table th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);padding:0 8px 8px 0;font-weight:700;letter-spacing:.3px;}
  table.data-table td{padding:7px 8px 7px 0;border-top:1px solid var(--paper-2);}

  .qr-box{background:white;border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center;box-shadow:var(--shadow);}
  #qrcode-canvas{display:flex;justify-content:center;margin:14px 0;}
  .qr-box .id-big{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:var(--bark);margin-top:6px;}

  .weight-summary{display:flex;justify-content:space-between;align-items:center;background:var(--paper-2);border-radius:8px;padding:12px 14px;margin-top:4px;margin-bottom:4px;}
  .weight-summary .val{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--bark);}
  .totals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
  .totals-grid .t-box{background:var(--paper-2);border-radius:8px;padding:11px 8px;text-align:center;}
  .totals-grid .t-box .v{font-family:'Fraunces',serif;font-weight:700;font-size:17px;color:var(--bark);}
  .totals-grid .t-box .l{font-size:10px;color:var(--ink-soft);margin-top:2px;text-transform:uppercase;letter-spacing:.3px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bark);color:white;padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,0.25);z-index:100;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .divider{height:1px;background:var(--line);margin:16px 0;}
  .small-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);padding:5px 0;}
  .link-row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-top:1px solid var(--paper-2);font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);}
  .link-row:first-child{border-top:none;}
  .audit-tag{font-size:10.5px;color:var(--ink-soft);background:var(--paper-2);border-radius:6px;padding:2px 7px;font-weight:600;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(36,22,16,0.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
  .modal-sheet{background:var(--paper);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px 18px 26px;max-height:88vh;overflow-y:auto;}
  .modal-sheet h3{margin-bottom:16px;font-size:17px;}

  #pdf-report{position:fixed;left:0;top:0;z-index:-1000;width:700px;background:white;color:#241610;padding:30px;font-family:'Inter',sans-serif;}
  #pdf-report h2{font-family:'Fraunces',serif;}
  #pdf-label{position:fixed;left:0;top:0;z-index:-1000;width:320px;background:white;color:#241610;font-family:'Inter',sans-serif;}
</style>
</head>
<body>

<div id="cacau-root">
  <div class="app-shell" id="app-shell"></div>
  <div class="toast" id="toast"></div>
  <div id="modal-root"></div>
  <div id="pdf-report"></div>
  <div id="pdf-label"></div>
</div>

<script>
(function(){
  const COLABORADORES = [
    {id:'ginaldo', nome:'Ginaldo'},
    {id:'marcondes', nome:'Marcondes'},
    {id:'eliara', nome:'Eliara'},
    {id:'romario', nome:'Romário'},
  ];
  const TALHOES = ['TA1','TB1','TC1','TD1','TA2','TB2','TC2','TD2','TA3','TB3','TC3','TA4','TB4','TA5','TB5'];
  const COCHOS = Array.from({length:20}, (_,i)=>i+1);
  const CAIXAS = Array.from({length:10}, (_,i)=>i+1);

  const STAGE_COLORS = {colheita:'var(--pod-green)', fermentacao:'var(--ferment)', secagem:'var(--dry)', classificacao:'var(--classify)', concluido:'var(--rust)'};
  const STAGE_LABELS = {colheita:'Colheita', fermentacao:'Fermentação', secagem:'Secagem', classificacao:'Classificação', concluido:'Concluído'};
  const STAGE_ORDER = ['colheita','fermentacao','secagem','classificacao','concluido'];

  let state = {
    user: null, route: 'login', currentLoteId: null, loteTab: 'colheita',
    lotes: {}, loading: true, openItems: {},
    syncConfig: { url: '', token: '' },
    colaboradores: COLABORADORES.slice(),
    adminPassword: 'admin123',
  };
  let syncTimer = null;

  const shell = document.getElementById('app-shell');

  // ---------- armazenamento ----------
  // Dentro do Claude existe storage; fora (arquivo baixado, aberto direto no navegador),
  // esse recurso não existe — então usamos localStorage do próprio navegador como alternativa,
  // e como último recurso, memória (com aviso, pois nesse caso nada é salvo entre sessões).
  let storageWarningShown = false;
  function warnNoStoragePersistence(){
    if(storageWarningShown) return; storageWarningShown = true;
    setTimeout(()=> toast('Atenção: este navegador não permite salvar dados — os lançamentos não vão persistir ao fechar o app.'), 800);
  }
  const memoryFallback = {};
  const storage = (typeof window!=='undefined' && window.storage) ? window.storage : {
    async get(key){
      try{
        const raw = localStorage.getItem('cacau_'+key);
        return raw!==null ? {key, value:raw} : null;
      }catch(e){
        warnNoStoragePersistence();
        return Object.prototype.hasOwnProperty.call(memoryFallback,key) ? {key, value:memoryFallback[key]} : null;
      }
    },
    async set(key, value){
      try{ localStorage.setItem('cacau_'+key, value); return {key, value}; }
      catch(e){ warnNoStoragePersistence(); memoryFallback[key]=value; return {key, value}; }
    },
    async delete(key){
      try{ localStorage.removeItem('cacau_'+key); }catch(e){ delete memoryFallback[key]; }
      return {key, deleted:true};
    },
  };

  const modalRoot = document.getElementById('modal-root');
  const toastEl = document.getElementById('toast');

  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 1900); }
  function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
  function uid(){ return 'id' + Math.random().toString(36).slice(2,9); }

  function isoWeek(date){
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
    const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
    return {week: weekNo, year: d.getUTCFullYear()};
  }
  function fmtDate(d){ if(!d) return ''; const dt = new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('pt-BR'); }
  function fmtDateTime(ts){ if(!ts) return ''; const dt = new Date(ts); return dt.toLocaleDateString('pt-BR') + ' ' + dt.toTimeString().slice(0,5); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function nowTime(){ return new Date().toTimeString().slice(0,5); }
  function sum(arr, fn){ return arr.reduce((a,x)=> a + (parseFloat(fn(x))||0), 0); }

  // ---------- persistence ----------
  async function loadLotes(){
    try{ const res = await storage.get('lotes-db', false); state.lotes = res && res.value ? JSON.parse(res.value) : {}; }
    catch(e){ state.lotes = {}; }
    state.loading = false;
  }
  async function saveLotesLocal(){
    try{ await storage.set('lotes-db', JSON.stringify(state.lotes), false); }
    catch(e){ toast('Não foi possível salvar. Tente novamente.'); }
  }
  async function saveLotes(){
    const lote = state.lotes[state.currentLoteId];
    if(lote) lote.syncStatus = 'pendente';
    await saveLotesLocal();
    scheduleSync();
  }
  async function loadUser(){
    try{ const res = await storage.get('current-user', false); if(res && res.value) state.user = JSON.parse(res.value); }catch(e){}
  }
  async function saveUser(){ try{ await storage.set('current-user', JSON.stringify(state.user), false); }catch(e){} }

  async function loadSyncConfig(){
    try{ const res = await storage.get('sync-config', false); if(res && res.value) state.syncConfig = JSON.parse(res.value); }catch(e){}
  }
  async function saveSyncConfig(){ try{ await storage.set('sync-config', JSON.stringify(state.syncConfig), false); }catch(e){} }

  async function loadAppConfig(){
    try{
      const res = await storage.get('app-config', false);
      if(res && res.value){
        const cfg = JSON.parse(res.value);
        if(cfg.colaboradores) state.colaboradores = cfg.colaboradores;
        if(cfg.adminPassword) state.adminPassword = cfg.adminPassword;
      }
    }catch(e){}
  }
  async function saveAppConfig(){
    try{ await storage.set('app-config', JSON.stringify({colaboradores: state.colaboradores, adminPassword: state.adminPassword}), false); }catch(e){}
  }

  function scheduleSync(){
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncPendentes, 1500);
  }

  async function syncLoteRemoto(lote){
    if(!state.syncConfig.url) return {ok:false, motivo:'Sincronização não configurada'};
    try{
      const resp = await fetch(state.syncConfig.url, {
        method: 'POST',
        headers: {'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ token: state.syncConfig.token || '', lote }),
      });
      let data;
      try{ data = await resp.json(); }
      catch(e){ return {ok:false, motivo:`Resposta inesperada do servidor (HTTP ${resp.status}). Confira se implantou a versão mais recente do .gs.`}; }
      if(!data.ok){ return {ok:false, motivo: data.erro || 'O servidor recusou os dados (verifique o token).'}; }
      return {ok:true};
    }catch(err){
      return {ok:false, motivo:'Falha de rede/conexão ao tentar falar com o Google Apps Script: ' + (err && err.message ? err.message : err)};
    }
  }

  async function syncPendentes(){
    if(!state.syncConfig.url) return;
    if(typeof navigator!=='undefined' && navigator.onLine===false) return;
    const pendentes = Object.values(state.lotes).filter(l=> l.syncStatus!=='ok');
    let ultimoErro = null;
    for(const lote of pendentes){
      const res = await syncLoteRemoto(lote);
      lote.syncStatus = res.ok ? 'ok' : 'erro';
      lote.lastSyncAt = Date.now();
      if(!res.ok){ lote.syncErro = res.motivo; ultimoErro = res.motivo; }
      else { lote.syncErro = null; }
    }
    await saveLotesLocal();
    // Importante: nunca damos um render() completo aqui quando o usuário está dentro de um lote —
    // isso reconstruiria a tela inteira e apagaria qualquer texto que a pessoa esteja digitando
    // num campo (ex: uma temperatura ainda não salva). Só atualizamos o selinho de status,
    // sem tocar no resto da tela.
    if(state.route==='dashboard'){
      render();
    } else if(state.route==='lote'){
      const badge = document.getElementById('lote-sync-badge');
      const lote = state.lotes[state.currentLoteId];
      if(badge && lote) badge.innerHTML = syncBadgeHTML(lote);
    }
    return ultimoErro;
  }

  function newLoteObj(talhao, dataColheita){
    const {week, year} = isoWeek(new Date(dataColheita+'T00:00:00'));
    const id = `${talhao}-${String(week).padStart(2,'0')}/${year}`;
    return {
      id, talhao, criadoEm: Date.now(), stage:'colheita', syncStatus:'pendente', lastSyncAt: null,
      colheitas: [], fermentacoes: [], secagens: [], auditoria: [],
      classificacao: {amostra:'', bemFermentados:'', fracamente:'', ardosia:'', mofados:'', germinados:'', achatados:'', danificados:'', peso100Amendoas:'', tipoFinal:'', obs:'', fotosTabuaCorte:[]},
    };
  }
  function registrarAuditoria(lote, acao){
    if(!lote.auditoria) lote.auditoria = [];
    lote.auditoria.unshift({ responsavel: state.user.nome, quando: Date.now(), acao });
  }
  function isAdmin(){ return state.user && state.user.role==='admin'; }
  function computeProgress(lote){ const idx = STAGE_ORDER.indexOf(lote.stage); return Math.round(((idx+1)/STAGE_ORDER.length)*100); }
  function recipienteLabel(tipo, numero){ return `${tipo==='cocho'?'Cocho':'Caixa'} ${numero}`; }
  function syncBadgeHTML(lote){
    if(!state.syncConfig.url) return `<div class="item-meta" style="margin-top:8px;">Sincronização não configurada</div>`;
    const map = {
      ok: {c:'var(--ok)', t:'✓ Sincronizado'},
      pendente: {c:'var(--dry)', t:'⏳ Pendente'},
      erro: {c:'var(--danger)', t:'✕ Falha ao sincronizar'},
    };
    const s = map[lote.syncStatus] || map.pendente;
    const erroLine = (lote.syncStatus==='erro' && lote.syncErro) ? `<div style="font-size:10.5px;color:var(--danger);margin-top:2px;font-weight:400;">${lote.syncErro}</div>` : '';
    return `<div class="item-meta" style="margin-top:8px;color:${s.c};font-weight:700;">${s.t}</div>${erroLine}`;
  }

  function toggleFullscreen(){
    if(!document.fullscreenElement){
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if(req){
        req.call(el).then(()=>{
          if(screen.orientation && screen.orientation.lock){
            screen.orientation.lock('portrait').catch(()=>{ /* navegador não permite travar orientação, tudo bem */ });
          }
        }).catch(()=> toast('Tela cheia não suportada neste navegador'));

  function photoPicker(onAdd, useCamera){
    const input = document.createElement('input'); input.type='file'; input.accept='image/*'; input.multiple=!useCamera;
    if(useCamera) input.capture = 'environment';
    input.onchange = (e)=>{
      Array.from(e.target.files||[]).forEach(file=>{
        const reader = new FileReader();
        reader.onload = (ev)=>{
          const img = new Image();
          img.onload = ()=>{
            const canvas = document.createElement('canvas'); const maxDim=480;
            let {width,height} = img;
            if(width>height && width>maxDim){ height=height*maxDim/width; width=maxDim; }
            else if(height>maxDim){ width=width*maxDim/height; height=maxDim; }
            canvas.width=width; canvas.height=height;
            canvas.getContext('2d').drawImage(img,0,0,width,height);
            onAdd(canvas.toDataURL('image/jpeg',0.7));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    };
    input.click();
  }

  function renderPhotoGrid(container, fotos, onRemove){
    container.innerHTML = fotos.map((f,i)=>`<div class="photo-thumb-wrap"><img class="photo-thumb" src="${f}"><button class="photo-remove" data-i="${i}">×</button></div>`).join('')
      + `<button class="photo-add" id="pg-cam" title="Tirar foto">📷</button>`
      + `<button class="photo-add" id="pg-gal" title="Escolher da galeria">🖼</button>`;
    container.querySelectorAll('.photo-remove').forEach(b=> b.onclick = ()=> onRemove(parseInt(b.dataset.i)));
    container.querySelector('#pg-cam').onclick = ()=> photoPicker(dataUrl=>{ fotos.push(dataUrl); renderPhotoGrid(container, fotos, onRemove); }, true);
    container.querySelector('#pg-gal').onclick = ()=> photoPicker(dataUrl=>{ fotos.push(dataUrl); renderPhotoGrid(container, fotos, onRemove); }, false);
  }

          row.innerHTML = `
            <div style="display:flex;gap:8px;align-items:flex-end;">

              <div><label style="display:block;font-size:10.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;">Frutos</label><input type="number" class="r-frutos" style="width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px;font-size:14px;"></div>

        body.querySelector('#b-add-row').onclick = addRow;
        addRow(); // já começa com uma linha

        body.querySelector('#b-save').onclick = async ()=>{

            novos.push({
              id: uid(), tipo: r.querySelector('.r-tipo').value, numero, data,

              colaboradoresColheita: colabColheita, colaboradoresPesagem: colabPesagem,
              peso: r.querySelector('.r-peso').value, nFrutos: r.querySelector('.r-frutos').value,
              fotos: [],

          if(novos.length===0){ toast('Preencha ao menos uma linha com número'); return; }
          lote.colheitas.push(...novos);
          await saveLotes(); closeModal(); render(); toast(`${novos.length} lançamento(s) adicionado(s)`);

      card.innerHTML = `
        <div class="item-head ${open?'open':''}" data-k="${key}">
          <div><div class="tag-id">${recipienteLabel(f.tipo, f.numero)}</div><div class="item-meta">${f.temperaturas.length} medições · ${f.viragens.length} viradas</div></div>

  function renderFermentacaoBody(el, lote, f){
    el.innerHTML = `
      <div class="small-row"><span>Registrado por</span><span class="audit-tag">${f.responsavel} · ${fmtDateTime(f.criadoEm)}</span></div>
      <div class="divider"></div>

      <table class="data-table" style="margin-top:10px;"><thead><tr><th>Data</th><th>Hora</th><th>Kg</th><th></th></tr></thead>
        <tbody id="massa-body-${f.id}"></tbody>
      </table>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input type="number" step="0.01" id="massa-valor-${f.id}" placeholder="Peso (kg)" style="flex:1;border:1.5px solid var(--line);border-radius:8px;padding:12px;font-size:15px;">

      <canvas id="chart-${f.id}" height="130"></canvas>
      <table class="data-table" style="margin-top:10px;"><thead><tr><th>Data</th><th>Hora</th><th>°C</th><th></th></tr></thead>
        <tbody id="temp-body-${f.id}"></tbody>
      </table>
      <div class="two-col" style="margin-top:10px;">
        <input type="date" id="temp-data-${f.id}" value="${todayISO()}">
        <input type="time" id="temp-hora-${f.id}" value="${nowTime()}">
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input type="number" step="0.1" id="temp-valor-${f.id}" placeholder="Temperatura °C" style="flex:1;border:1.5px solid var(--line);border-radius:8px;padding:12px;font-size:15px;">
        <button class="btn btn-primary btn-sm" id="btn-add-temp-${f.id}">+</button>
      </div>
      <div class="divider"></div>
      <div class="card-title" style="margin-bottom:8px;">Viragens</div>
      <table class="data-table"><thead><tr><th>Data/Hora</th><th>Antes</th><th>Depois</th><th></th></tr></thead>
        <tbody id="vir-body-${f.id}"></tbody>
      </table>
      <div class="two-col" style="margin-top:10px;margin-bottom:10px;">
        <input type="date" id="vir-data-${f.id}" value="${todayISO()}">
        <input type="time" id="vir-hora-${f.id}" value="${nowTime()}">
      </div>
      <div class="two-col">
        <input type="number" step="0.1" id="vir-antes-${f.id}" placeholder="Temp. antes °C">
        <input type="number" step="0.1" id="vir-depois-${f.id}" placeholder="Temp. depois °C">
      </div>
      <button class="btn btn-secondary" id="btn-add-vir-${f.id}" style="margin-top:10px;">Registrar virada</button>
      <div class="divider"></div>
      <div class="card-title" style="margin-bottom:8px;">Fotos do cocho/caixa</div>
      <div class="photo-grid" id="cocho-fotos-${f.id}"></div>
      <div class="divider"></div>
      ${isAdmin() ? `<button class="icon-del" id="del-ferm-${f.id}">Excluir este registro de fermentação</button>` : ''}
    `;
    function refreshTable(){
      if(!f.pesagensMassa) f.pesagensMassa = [];
      el.querySelector(`#massa-body-${f.id}`).innerHTML = f.pesagensMassa.map((m,i)=>`<tr><td>${fmtDate(m.data)}</td><td>${m.hora}</td><td>${m.peso} kg</td><td><button class="icon-del" data-i="${i}">✕</button></td></tr>`).join('') || `<tr><td colspan="4" style="color:var(--ink-soft)">Nenhuma pesagem lançada.</td></tr>`;
      el.querySelector(`#massa-total-${f.id}`).textContent = sum(f.pesagensMassa, m=>m.peso).toFixed(2) + ' kg';
      el.querySelectorAll(`#massa-body-${f.id} [data-i]`).forEach(b=> b.onclick = async ()=>{
        if(!confirm('Excluir esta pesagem de massa?')) return;
        f.pesagensMassa.splice(parseInt(b.dataset.i),1); await saveLotes(); render();
      });
      el.querySelector(`#temp-body-${f.id}`).innerHTML = f.temperaturas.map((t,i)=>`<tr><td>${fmtDate(t.data)}</td><td>${t.hora}</td><td>${t.temp} °C</td><td><button class="icon-del" data-edit-i="${i}" style="color:var(--rust);">✎</button> <button class="icon-del" data-i="${i}">✕</button></td></tr>`).join('') || `<tr><td colspan="4" style="color:var(--ink-soft)">Nenhuma medição.</td></tr>`;
      el.querySelectorAll(`#temp-body-${f.id} [data-i]`).forEach(b=> b.onclick = async ()=>{
        if(!confirm('Excluir esta medição de temperatura?')) return;
        f.temperaturas.splice(parseInt(b.dataset.i),1); await saveLotes(); render();
      });
      el.querySelectorAll(`#temp-body-${f.id} [data-edit-i]`).forEach(b=> b.onclick = ()=> abrirEdicaoTemperatura(lote, f, parseInt(b.dataset.editI)));
      el.querySelector(`#vir-body-${f.id}`).innerHTML = f.viragens.map((v,i)=>`<tr><td>${fmtDate(v.data)} ${v.hora}</td><td>${v.antes}°C</td><td>${v.depois}°C</td><td><button class="icon-del" data-edit-i="${i}" style="color:var(--rust);">✎</button> <button class="icon-del" data-i="${i}">✕</button></td></tr>`).join('') || `<tr><td colspan="4" style="color:var(--ink-soft)">Nenhuma virada.</td></tr>`;
      el.querySelectorAll(`#vir-body-${f.id} [data-i]`).forEach(b=> b.onclick = async ()=>{
        if(!confirm('Excluir esta virada?')) return;
        f.viragens.splice(parseInt(b.dataset.i),1); await saveLotes(); render();
      });
      el.querySelectorAll(`#vir-body-${f.id} [data-edit-i]`).forEach(b=> b.onclick = ()=> abrirEdicaoViragem(lote, f, parseInt(b.dataset.editI)));
    }
    refreshTable();
    drawTempChart(el.querySelector(`#chart-${f.id}`), f.temperaturas);
    renderPhotoGrid(el.querySelector(`#cocho-fotos-${f.id}`), f.fotosCocho, async (i)=>{ f.fotosCocho.splice(i,1); await saveLotes(); render(); });

    el.querySelector(`#btn-add-massa-${f.id}`).onclick = async ()=>{
      const v = el.querySelector(`#massa-valor-${f.id}`).value;
      if(!v){ toast('Informe o peso'); return; }
      if(!f.pesagensMassa) f.pesagensMassa = [];
      f.pesagensMassa.push({data: todayISO(), hora: nowTime(), peso: v});
      await saveLotes(); render();
    };

    el.querySelector(`#btn-add-temp-${f.id}`).onclick = async ()=>{
      const temp = el.querySelector(`#temp-valor-${f.id}`).value;
      if(!temp){ toast('Informe a temperatura'); return; }
      f.temperaturas.push({data: el.querySelector(`#temp-data-${f.id}`).value, hora: el.querySelector(`#temp-hora-${f.id}`).value, temp});
      f.temperaturas.sort((a,b)=> (a.data+a.hora).localeCompare(b.data+b.hora));
      await saveLotes(); render();
    };
    el.querySelector(`#btn-add-vir-${f.id}`).onclick = async ()=>{

  function drawTempChart(canvas, temps){
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.clientWidth || 280; const h = canvas.height = 130;
    ctx.clearRect(0,0,w,h);
    if(temps.length<1){ ctx.fillStyle='#5b4a3d'; ctx.font='12px Inter'; ctx.fillText('Sem dados suficientes para o gráfico.', 8, h/2); return; }
    const vals = temps.map(t=>parseFloat(t.temp)).filter(v=>!isNaN(v));
    const min = Math.min(...vals, 15), max = Math.max(...vals, 50);
    const padL=30, padB=20, padT=10;
    ctx.strokeStyle='#DCCEB0'; ctx.lineWidth=1;
    for(let i=0;i<=3;i++){ const y = padT + (h-padT-padB)*i/3; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-6,y); ctx.stroke(); }
    ctx.strokeStyle='#BD5A21'; ctx.lineWidth=2.5; ctx.beginPath();
    const n = temps.length;
    temps.forEach((t,i)=>{
      const x = padL + (w-padL-10)*(n>1?i/(n-1):0.5);
      const v = parseFloat(t.temp);
      const y = h-padB - ((v-min)/(max-min||1))*(h-padT-padB);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    ctx.fillStyle='#BD5A21';
    let lastDate = null;
    temps.forEach((t,i)=>{
      const x = padL + (w-padL-10)*(n>1?i/(n-1):0.5);
      const v = parseFloat(t.temp);
      const y = h-padB - ((v-min)/(max-min||1))*(h-padT-padB);
      ctx.beginPath(); ctx.arc(x,y,2.6,0,7); ctx.fill();
      if(t.data !== lastDate){
        ctx.fillStyle='#5b4a3d'; ctx.font='9px Inter';
        ctx.fillText(fmtDate(t.data).slice(0,5), x-12, h-4);
        ctx.fillStyle='#BD5A21';
        lastDate = t.data;
      }
    });
    ctx.fillStyle='#5b4a3d'; ctx.font='10px Inter';
    ctx.fillText(max.toFixed(1), 2, padT+8);
    ctx.fillText(min.toFixed(1), 2, h-padB);
  }

  function renderTabClassificacao(el, lote){
    const c = lote.classificacao;
    if(!c.fotosTabuaCorte) c.fotosTabuaCorte = [];
    function calcPctFromValues(amostra, bem, categorias){
      const soma = categorias.reduce((a,v)=> a + (parseFloat(v)||0), 0);
      const base = (parseFloat(amostra)||0) > 0 ? parseFloat(amostra) : soma;
      return base>0 ? ((parseFloat(bem)||0)/base*100) : 0;
    }
    const initialPct = calcPctFromValues(c.amostra, c.bemFermentados, [c.bemFermentados,c.fracamente,c.ardosia,c.mofados,c.germinados,c.achatados,c.danificados]);

        <div class="field"><label>Tamanho da amostra</label><input type="number" id="cl-amostra" value="${c.amostra}" placeholder="Ex: 100 (se deixar em branco, usa a soma das categorias abaixo)"></div>
        <div class="two-col">
          <div class="field"><label>Bem fermentados</label><input type="number" id="cl-bem" value="${c.bemFermentados}"></div>

        </div>
        <div class="two-col">
          <div class="field"><label>Germinados</label><input type="number" id="cl-germ" value="${c.germinados}"></div>
          <div class="field"><label>Achatados/quebrados</label><input type="number" id="cl-achat" value="${c.achatados}"></div>
        </div>
        <div class="field"><label>Danificados por insetos</label><input type="number" id="cl-danif" value="${c.danificados}"></div>
        <div class="field"><label>Peso de 100 amêndoas (g)</label><input type="number" step="0.01" id="cl-peso100" value="${c.peso100Amendoas||''}" placeholder="Ex: 88"></div>
        <div class="weight-summary" style="margin-bottom:16px;"><span>% de fermentação (calculado)</span><span class="val" id="cl-pct">${initialPct.toFixed(1)}%</span></div>
        <div class="field"><label>Classificação final</label>
          <select id="cl-tipo">
            <option value="">Selecione</option>
            <option value="Tipo 1" ${c.tipoFinal==='Tipo 1'?'selected':''}>Tipo 1</option>
            <option value="Tipo 2" ${c.tipoFinal==='Tipo 2'?'selected':''}>Tipo 2</option>
            <option value="Fora de tipo" ${c.tipoFinal==='Fora de tipo'?'selected':''}>Fora de tipo</option>
          </select>
        </div>
        <div class="field"><label>Observações</label><textarea id="cl-obs">${c.obs}</textarea></div>
        <div class="field"><label>Fotos da tábua de corte</label><div class="photo-grid" id="cl-fotos"></div></div>
        <button class="btn btn-primary" id="btn-save-classif">Salvar classificação</button>
      </div>`;

    renderPhotoGrid(el.querySelector('#cl-fotos'), c.fotosTabuaCorte, async (i)=>{ c.fotosTabuaCorte.splice(i,1); await saveLotes(); render(); });

    function recomputeLive(){
      const amostra = el.querySelector('#cl-amostra').value;
      const bem = el.querySelector('#cl-bem').value;
      const categorias = ['#cl-bem','#cl-fraco','#cl-ardosia','#cl-mofados','#cl-germ','#cl-achat','#cl-danif'].map(sel=> el.querySelector(sel).value);
      el.querySelector('#cl-pct').textContent = calcPctFromValues(amostra, bem, categorias).toFixed(1) + '%';
    }
    ['#cl-amostra','#cl-bem','#cl-fraco','#cl-ardosia','#cl-mofados','#cl-germ','#cl-achat','#cl-danif'].forEach(sel=>{
      el.querySelector(sel).addEventListener('input', recomputeLive);
    });

    el.querySelector('#btn-save-classif').onclick = async ()=>{
      const jaExistia = !!c.dataHora;
      c.amostra=el.querySelector('#cl-amostra').value; c.bemFermentados=el.querySelector('#cl-bem').value;
      c.fracamente=el.querySelector('#cl-fraco').value; c.ardosia=el.querySelector('#cl-ardosia').value;

      stageAdvanceButton(el, lote, 'concluido', 'Concluir lote → gerar QR Code');
    }
  }

  function photoStripHTML(fotos, emptyMsg){
    if(!fotos || fotos.length===0) return `<p style="color:#8a7a68;font-size:11.5px;">${emptyMsg}</p>`;
    return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;">${fotos.map(f=>`<img src="${f}" style="width:90px;height:90px;object-fit:cover;border-radius:5px;border:1px solid #DCCEB0;">`).join('')}</div>`;
  }

  function gerarPDF(lote){
    const totFrutos = sum(lote.colheitas, c=>c.nFrutos);
    const totPeso = sum(lote.colheitas, c=>c.peso);
    const totPesoMassa = sum(lote.fermentacoes, f=> sum(f.pesagensMassa||[], m=>m.peso));
    const totEntrada = sum(lote.secagens, s=>s.pesoEntrada);
    const totSaidaCocho = sum(lote.secagens, s=>s.pesoSaidaCocho);
    const totSaidaEstufa = sum(lote.secagens, s=>s.pesoSaidaEstufa);
    const report = document.getElementById('pdf-report');
    const sectionStyle = 'margin-top:22px;padding-top:14px;border-top:2px solid #241610;';
    const thStyle = 'background:#EDE3CE;text-align:left;';

    report.innerHTML = `
      <div style="border-bottom:3px solid #BD5A21;padding-bottom:14px;margin-bottom:10px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#5b4a3d;font-weight:700;">Relatório de Rastreabilidade</div>
        <h2 style="font-size:26px;margin:4px 0;">Lote ${lote.id}</h2>
        <div style="font-size:12.5px;color:#5b4a3d;">Talhão ${lote.talhao} · Documento gerado em ${new Date().toLocaleString('pt-BR')}</div>
      </div>

      <div style="${sectionStyle}">
        <h3 style="font-size:16px;">1. Colheita</h3>
        <p style="font-size:12.5px;"><b>Totais acumulados:</b> ${lote.colheitas.length} caixas/bags · ${totFrutos} frutos · ${totPeso.toFixed(1)} kg de peso</p>
        ${lote.colheitas.map(c=>`
          <div style="margin-bottom:12px;padding:10px;background:#F6F0E4;border-radius:6px;">
            <div style="font-size:12.5px;"><b>${c.tipo==='bag'?'Bag':'Caixa'} ${c.numero}</b> — ${fmtDate(c.data)} — ${c.nFrutos||0} frutos, ${c.peso||0} kg</div>
            <div style="font-size:11px;color:#5b4a3d;">Colheita: ${c.colaboradoresColheita||'—'} · Pesagem/contagem: ${c.colaboradoresPesagem||'—'}</div>
            <div style="font-size:11px;color:#5b4a3d;">Registrado por ${c.responsavel} em ${fmtDateTime(c.criadoEm)}</div>
            ${photoStripHTML(c.fotos, 'Sem fotos anexadas neste lançamento.')}
          </div>`).join('') || '<p style="font-size:12px;">Nenhum lançamento de colheita.</p>'}
      </div>

      <div style="${sectionStyle}">
        <h3 style="font-size:16px;">2. Fermentação</h3>
        <p style="font-size:12.5px;"><b>Total de massa (após quebra):</b> ${totPesoMassa.toFixed(1)} kg</p>
        ${lote.fermentacoes.map(f=>`
          <div style="margin-bottom:16px;padding:10px;background:#F6F0E4;border-radius:6px;">
            <div style="font-size:13px;font-weight:700;">${recipienteLabel(f.tipo,f.numero)}</div>
            <div style="font-size:11px;color:#5b4a3d;margin-bottom:6px;">Registrado por ${f.responsavel} em ${fmtDateTime(f.criadoEm)} · Peso da massa: ${sum(f.pesagensMassa||[], m=>m.peso).toFixed(2)} kg</div>
            <div style="font-size:11.5px;font-weight:700;margin-top:6px;">Temperatura do cocho</div>
            <canvas id="pdf-chart-${f.id}" width="620" height="160" style="width:100%;max-width:620px;"></canvas>
            <table border="1" cellpadding="5" style="border-collapse:collapse;width:100%;font-size:11px;margin-top:6px;">
              <tr style="${thStyle}"><th>Data</th><th>Hora</th><th>Temp.</th></tr>
              ${f.temperaturas.map(t=>`<tr><td>${fmtDate(t.data)}</td><td>${t.hora}</td><td>${t.temp} °C</td></tr>`).join('') || '<tr><td colspan="3">Sem medições</td></tr>'}
            </table>
            <div style="font-size:11.5px;font-weight:700;margin-top:10px;">Viragens</div>
            <table border="1" cellpadding="5" style="border-collapse:collapse;width:100%;font-size:11px;margin-top:4px;">
              <tr style="${thStyle}"><th>Data/Hora</th><th>Antes</th><th>Depois</th></tr>
              ${f.viragens.map(v=>`<tr><td>${fmtDate(v.data)} ${v.hora}</td><td>${v.antes} °C</td><td>${v.depois} °C</td></tr>`).join('') || '<tr><td colspan="3">Sem viradas</td></tr>'}
            </table>
            <div style="font-size:11.5px;font-weight:700;margin-top:10px;">Fotos do cocho/caixa</div>
            ${photoStripHTML(f.fotosCocho, 'Sem fotos anexadas.')}
          </div>`).join('') || '<p style="font-size:12px;">Nenhum registro de fermentação.</p>'}
      </div>

      <div style="${sectionStyle}">
        <h3 style="font-size:16px;">3. Secagem</h3>
        <table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:11.5px;">
          <tr style="${thStyle}"><th>Bancada</th><th>Origem</th><th>Responsável</th><th>Data/hora</th><th>Entrada</th><th>Saída cocho</th><th>Saída estufa</th></tr>
          ${lote.secagens.map(s=>`<tr><td>${s.bancada||'—'}</td><td>${recipienteLabel(s.tipoOrigem,s.numeroOrigem)}</td><td>${s.responsavel}</td><td>${fmtDateTime(s.criadoEm)}</td><td>${s.pesoEntrada||0} kg</td><td>${s.pesoSaidaCocho||0} kg</td><td>${s.pesoSaidaEstufa||0} kg</td></tr>`).join('') || '<tr><td colspan="7">Sem registros</td></tr>'}
        </table>
        <div style="display:flex;gap:14px;margin-top:10px;font-size:12.5px;">
          <div><b>Total entrada:</b> ${totEntrada.toFixed(2)} kg</div>
          <div><b>Total saída cocho:</b> ${totSaidaCocho.toFixed(2)} kg</div>
          <div><b>Total saída estufa:</b> ${totSaidaEstufa.toFixed(2)} kg</div>
        </div>
        <p style="font-size:13px;font-weight:700;margin-top:8px;">Peso final consolidado do lote: ${totSaidaEstufa.toFixed(2)} kg</p>
        <p style="font-size:12.5px;">Umidade final: ${lote.umidadeFinal ? lote.umidadeFinal+'%' : '—'}</p>
      </div>

      <div style="${sectionStyle}">
        <h3 style="font-size:16px;">4. Classificação</h3>
        <table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:11.5px;">
          <tr style="${thStyle}"><th>Amostra</th><th>Bem ferm.</th><th>Fraco/violáceo</th><th>Ardosia</th><th>Mofados</th><th>Germinados</th><th>Achatados</th><th>Danificados</th></tr>
          <tr><td>${lote.classificacao.amostra||'—'}</td><td>${lote.classificacao.bemFermentados||'—'}</td><td>${lote.classificacao.fracamente||'—'}</td><td>${lote.classificacao.ardosia||'—'}</td><td>${lote.classificacao.mofados||'—'}</td><td>${lote.classificacao.germinados||'—'}</td><td>${lote.classificacao.achatados||'—'}</td><td>${lote.classificacao.danificados||'—'}</td></tr>
        </table>
        <p style="font-size:12.5px;margin-top:8px;">Peso de 100 amêndoas: ${lote.classificacao.peso100Amendoas ? lote.classificacao.peso100Amendoas+' g' : '—'}</p>
        <p style="font-size:13px;"><b>Classificação final:</b> ${lote.classificacao.tipoFinal || '—'}</p>
        <p style="font-size:11.5px;color:#5b4a3d;">Observações: ${lote.classificacao.obs || '—'}</p>
        <div style="font-size:11.5px;font-weight:700;margin-top:8px;">Fotos da tábua de corte</div>
        ${photoStripHTML(lote.classificacao.fotosTabuaCorte, 'Sem fotos anexadas.')}
      </div>
    `;

    // desenha os gráficos de temperatura de cada fermentação dentro do relatório
    lote.fermentacoes.forEach(f=>{
      const c = report.querySelector(`#pdf-chart-${f.id}`);
      if(c) drawTempChart(c, f.temperaturas);
    });

    toast('Gerando PDF...');
    setTimeout(()=>{
      html2pdf().from(report).set({
        filename:`relatorio-${lote.id.replace('/','-')}.pdf`,
        margin:10,
        pagebreak:{mode:['css','legacy']},
        html2canvas:{scale:2, useCORS:true},
      }).save()
        .then(()=> toast('Relatório baixado'))
        .catch(()=> toast('Erro ao gerar PDF'));
    }, 60);
  }

  async function baixarDoServidor(){
    if(!state.syncConfig.url) return 'Sincronização não configurada';
    try{
      const resp = await fetch(state.syncConfig.url + '?listarLotes=1');
      const data = await resp.json();
      if(!data.ok || !Array.isArray(data.lotes)) return (data && data.erro) || 'Resposta inesperada do servidor';
      let mudou = false;
      data.lotes.forEach(remoto=>{
        const local = state.lotes[remoto.id];
        // Só substituímos a versão local se ela já estiver sincronizada (sem edições pendentes) —
        // assim nunca perdemos um lançamento que ainda não foi enviado para a planilha.
        if(!local || local.syncStatus==='ok'){
          state.lotes[remoto.id] = remoto;
          mudou = true;
        }
      });
      if(mudou){
        await saveLotesLocal();
        if(state.route==='dashboard') render();
      }
      return null;
    }catch(err){
      return 'Falha ao buscar dados da planilha: ' + (err && err.message ? err.message : err);
    }
  }

  async function boot(){
    await loadUser(); await loadLotes(); await loadSyncConfig(); await loadAppConfig();
    if(!state.syncConfig.url){
      state.syncConfig.url = 'https://script.google.com/macros/s/AKfycbzOhr9FnGSTH85fpqese49AmoaX1fKCfIfdJJBXlTI9x-otshWrP_zMzCcQcGNykUD_0A/exec';
      await saveSyncConfig();
    }
    state.route = state.user ? 'dashboard' : 'login';
    render();
    await baixarDoServidor();
    syncPendentes();
  }
  boot();
})();
</script>

</body>
</html>
